name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.TOKEN }}
    strategy:
      matrix:
        svc:
          - name: auth-service
            context: ./services/auth-service
            dockerfile: ./services/auth-service/Dockerfile
          - name: fe
            context: ./fe
            dockerfile: ./fe/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: bin8761
          password: ${{ env.TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.svc.context }}
          file: ${{ matrix.svc.dockerfile }}
          push: true
          tags: |
            bin8761/${{ matrix.svc.name }}:${{ github.ref_name }}
            bin8761/${{ matrix.svc.name }}:${{ github.sha }}
            ${{ (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'develop') && format('bin8761/{0}:latest', matrix.svc.name) || '' }}
